services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supermarket-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SupermarketDbConnection: "Server=sqlserver,1433;Database=SupermarketDb;User Id=sa;TrustServerCertificate=True"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - supermarket-network
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supermarket-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    networks:
      - supermarket-network
    volumes:
      - supermarket-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  supermarket-sqlserver-data:

networks:
  supermarket-network:
    name: supermarket-network
    driver: bridge
